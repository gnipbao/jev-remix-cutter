name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install package and core dependencies
        run: python -m pip install -e '.[core]'
      - name: Run local synthetic and stubbed tests
        run: python -m unittest discover -s tests -v
      - name: Build a wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist
