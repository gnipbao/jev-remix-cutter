<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Remix 审片</title><style>
body{margin:0;background:#101419;color:#e4e9ee;font:16px system-ui}header,main{max-width:1150px;margin:auto;padding:24px}h1{font-size:27px}button{background:#8dd5c3;color:#132b26;border:0;padding:9px 14px;border-radius:6px;cursor:pointer}section{background:#1b232c;padding:16px;margin:16px 0;border-radius:10px}.slots{display:flex;gap:3px;overflow:auto}.slots button{min-width:90px}.active{outline:2px solid #fff}img,video{max-width:100%;max-height:500px}pre{white-space:pre-wrap;font-size:13px}.warn{color:#f5c783}.mock{color:#ff9a9a}input{margin-right:8px}label{margin-right:16px}p{line-height:1.6}svg{width:100%;height:70px}.bars rect{fill:#83bfae}small{color:#aab8c4}
</style><header><h1>Remix 审片</h1><p id="status"></p><video id="video" controls hidden></video><svg id="wave" viewBox="0 0 1000 70" aria-label="节拍网格"></svg><div id="slots" class="slots"></div></header><main><section id="detail"></section><section><h2>原创度提示</h2><small>阈值是可编辑建议值，不代表平台审核规则。</small><div id="original"></div></section><section><button id="download">导出 feedback.json</button><p>保存反馈文件后运行 remix feedback --run … --file feedback.json，再 assemble。</p><pre id="actions"></pre></section></main>
<script type="application/json" id="data">__REMIX_DATA__</script><script>
const data=JSON.parse(document.getElementById('data').textContent), actions=new Map(), get=id=>document.getElementById(id);
get('status').textContent=data.cast.mock?'MOCK：仅用于开发测试，不可当作真实 Jev 审片结果':'逐槽查看画面、得分与授权，确认钩子、drop 和结尾。';if(data.cast.mock)get('status').className='mock';
if(data.video){get('video').hidden=false;get('video').src=data.video}
const max=data.cast.items.at(-1)?.out?.end_f||1;for(const beat of data.music?.beats||[]){const line=document.createElementNS('http://www.w3.org/2000/svg','line');line.setAttribute('x1',beat.frame/max*1000);line.setAttribute('x2',beat.frame/max*1000);line.setAttribute('y1',beat.downbeat?8:30);line.setAttribute('y2','66');line.setAttribute('stroke',beat.downbeat?'#8dd5c3':'#4b6664');get('wave').append(line)}
function el(tag,text){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;return n}
function setAction(type,item,extra={}){actions.set(type+':'+item.slot,{type,slot:item.slot,...extra});get('actions').textContent=JSON.stringify([...actions.values()],null,2)}
function show(item){const d=get('detail');d.replaceChildren(el('h2',item.slot+' · '+item.shot_id));const shot=data.shots.find(s=>s.shot_id===item.shot_id),src=data.sources.find(s=>s.id===item.source);if(shot?.contact){const i=el('img');i.src=shot.contact;i.alt=item.shot_id;d.append(i)}d.append(el('p','素材授权：'+(src?.license||'unknown')));const score=el('pre',JSON.stringify({fused:item.fused,reasons:item.reasons,alternatives:item.alternatives},null,2));d.append(score);for(const [i,a] of (item.alternatives||[]).entries()){const b=el('button','替换 '+(i+1)+' · '+a.shot_id);b.onclick=()=>setAction('swap',item,{shot_id:a.shot_id});d.append(b,document.createTextNode(' '))}const l=el('button',item.locked?'解除锁定':'锁定');l.onclick=()=>setAction('lock',item,{locked:!item.locked});const e=el('button','排除镜头');e.onclick=()=>setAction('exclude',item);d.append(l,document.createTextNode(' '),e);if(!get('video').hidden)get('video').currentTime=item.out.start_f/(data.cast.fps||30)}
for(const item of data.cast.items){const b=el('button',item.slot);b.onclick=()=>show(item);get('slots').append(b)}if(data.cast.items.length)show(data.cast.items[0]);
if(data.originality){get('original').append(el('pre',JSON.stringify(data.originality.metrics,null,2)));for(const f of data.originality.findings||[]){const p=el('p',f.metric+'：'+f.suggest+' · '+f.action);p.className='warn';const where=Array.isArray(f.where)?f.where[0]:f.where;if(where){p.style.cursor='pointer';p.onclick=()=>{const item=data.cast.items.find(x=>x.out.start_f<=where.start_f&&x.out.end_f>where.start_f);if(item)show(item);if(!get('video').hidden)get('video').currentTime=where.start_f/(data.cast.fps||30)}}get('original').append(p)}}else get('original').textContent='assemble 后生成报告。';
get('download').onclick=()=>{const blob=new Blob([JSON.stringify({version:1,actions:[...actions.values()]},null,2)],{type:'application/json'}),a=el('a');a.href=URL.createObjectURL(blob);a.download='feedback.json';a.click();URL.revokeObjectURL(a.href)};
</script></html>
